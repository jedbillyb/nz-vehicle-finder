<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Fonts are self-hosted variable files (every weight in one file), preloaded so they
       arrive with the HTML. From Google Fonts they landed ~3s in, after the data, and all the
       text visibly redrew in the new font. Latin-ext (macrons) only downloads if used. -->
  <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/jetbrains-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    @font-face { font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/fonts/inter-latin-wght-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    @font-face { font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/fonts/inter-latin-ext-wght-normal.woff2) format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
    @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 100 800; font-display: swap; src: url(/fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  </style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- iPhone Safari colours the gap a bounce past the top or bottom of the page
       opens from the html/body background. Keep that background matched to the
       nearer end of the page (index.css): the nav's blue at the top, the
       footer's pale blue at the bottom. Inline so it's set before first paint. -->
  <script>
    (function () {
      var html = document.documentElement, end = "top";
      html.setAttribute("data-end", end);
      function update() {
        var y = window.scrollY, max = html.scrollHeight - window.innerHeight;
        // A page with (almost) nothing to scroll shows its bottom edge all the
        // time, so it keeps the footer's colour.
        var next = max >= 120 && y <= max - y ? "top" : "bottom";
        if (next !== end) { end = next; html.setAttribute("data-end", end); }
      }
      addEventListener("scroll", update, { passive: true });
      addEventListener("resize", update);
      addEventListener("load", update);
      // The page's height changes as it renders and on each route, with no scroll.
      if (window.ResizeObserver) addEventListener("DOMContentLoaded", function () { new ResizeObserver(update).observe(document.body); });
    })();
  </script>
